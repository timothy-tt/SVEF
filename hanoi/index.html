<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SVEF Ha Noi 2026 — Delegate App</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* SVEF Ha Noi 2026 delegate app. One event, one file.
   Palette and type follow ../BRAND.md: brand spot colours untouched, the Hanoi
   event ground (--wash) as the page fill, square corners, Inter Tight as the only
   face. TT Days Sans Black is deliberately absent (no Vietnamese diacritics, no
   web licence); the wordmark ships as outlined SVG instead. */
:root{
  --red:#E42026; --red-d:#B31018; --red-t:#FDECEC; --red-ink:#B31018;
  --green:#3E7742; --green-d:#2C5730; --green-t:#EDF3EE;
  --maroon:#800000; --gold:#C3933A; --gold-ink:#754715; --gold-t:#FBF3E4;
  --cream:#FFF9B8; --sky:#E2F4FD; --steel:#A8CED7;
  --ink:#0E273D; --ink-2:#224861; --muted:#3C6980; --line:#DAEDF0;
  --hanoi:#04723D; --hanoi-2:#3E7742; --wash:#F6FBF2; --wash-2:#EDF6EA;
  --deep:#123A2A;
  --bg:var(--wash); --card:#fff; --soft:var(--wash-2);
  --shadow:0 18px 44px rgba(14,39,61,.16);
  --sans:"Inter Tight","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Inline icons are emitted by ico() all over the app, including places with no
   component rule of their own. Without a base size an SVG scales to fill its box
   and, with no stroke set, paints as a solid black shape. Later rules override. */
svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:#0B1F16;color:var(--ink);font-size:15px;
  line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;align-items:center;
  justify-content:center;min-height:100vh;padding:24px 16px}
.frame{width:414px;max-width:100%;height:880px;max-height:calc(100vh - 48px);
  background:var(--bg);position:relative;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column}
@media (max-width:480px){
  body{padding:0;display:block;background:var(--bg)}
  .frame{width:100%;height:100dvh;max-height:none;box-shadow:none}
}
/* ---------- chrome ---------- */
.status{height:26px;flex:0 0 26px;background:var(--deep);color:#fff;display:flex;
  align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;
  font-weight:600;letter-spacing:.02em}
.top{flex:0 0 auto;background:linear-gradient(160deg,var(--deep),var(--ink));color:#fff;
  padding:11px 12px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11px;font-weight:500;opacity:.72;margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:0;
  background:rgba(255,255,255,.12);color:inherit;cursor:pointer;padding:0;position:relative}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 3px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;
  place-items:center;line-height:1}
.lang{border:0;background:rgba(255,255,255,.12);color:inherit;font:inherit;font-size:11px;
  font-weight:700;letter-spacing:.06em;padding:8px;cursor:pointer;flex:0 0 auto}
.screens{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.tabs{flex:0 0 var(--nav);height:var(--nav);background:var(--card);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;
  font-weight:600;padding:0;position:relative}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--hanoi)}
.tab[aria-selected=true] svg{stroke-width:2.2}
.tab .bdg{position:absolute;top:7px;right:calc(50% - 21px);min-width:15px;height:15px;
  padding:0 3px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;line-height:1}
/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(160deg,var(--deep),var(--ink));color:#fff;
  padding:20px 18px 22px;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;
  filter:saturate(.7) blur(1.5px)}
.hero .scrim{position:absolute;inset:0;
  background:linear-gradient(165deg,rgba(18,58,42,.82),rgba(14,39,61,.92))}
.hero .in{position:relative}
.hero .mark{display:block;width:100%;max-width:296px;height:auto;margin:2px 0 8px}
.hero .ed{font-size:15px;font-weight:600;color:var(--cream);margin-bottom:12px}
.when{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(255,255,255,.14);padding:6px 10px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.18);
  margin-top:16px}
.cd div{background:rgba(11,31,22,.55);padding:9px 4px;text-align:center}
.cd b{display:block;font-size:20px;font-weight:800;line-height:1;letter-spacing:-.02em}
.cd span{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  opacity:.75}
/* ---------- blocks ---------- */
.sec{padding:18px 16px 4px}
.sec h3{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 a,.sec h3 button.lnk{margin-left:auto;font-size:11px;letter-spacing:0;
  text-transform:none;color:var(--hanoi);font-weight:600;text-decoration:none;cursor:pointer;
  border:0;background:none;font-family:inherit;padding:0}
.pad{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);padding:14px}
.card + .card{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;
  background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:14px;
  padding:13px 16px;cursor:pointer;width:100%}
.btn:active{background:var(--red-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.green{background:var(--hanoi)}
.btn.sm{padding:9px 11px;font-size:12.5px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{background:var(--card);border:1px solid var(--line);padding:14px 12px;text-align:left;
  font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink);
  text-decoration:none;position:relative}
.tile svg{width:20px;height:20px;stroke:var(--hanoi);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14px;font-weight:700}
.tile > span{font-size:11.5px;color:var(--muted);line-height:1.35}
.tile .n{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;
  color:var(--hanoi)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;background:var(--soft);
  color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.tbd,.chip.gold{background:var(--gold-t);border-color:#EBD9B4;color:var(--gold-ink)}
.chip.on{background:var(--green-t);border-color:#CFE0D2;color:var(--green-d)}
.chip.red{background:var(--red-t);border-color:#F3CFD1;color:var(--red-ink)}
.empty{padding:14px;background:var(--gold-t);border:1px solid #EBD9B4;color:var(--gold-ink);
  font-size:12.5px;line-height:1.5}
.note{padding:12px 16px;font-size:11.5px;color:var(--muted);line-height:1.5}
.demo{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold-ink);background:#fff;border:1px solid #EBD9B4;
  padding:2px 6px;margin-right:4px}
/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;font:inherit;cursor:pointer;
  padding:11px 14px 9px;color:var(--muted);border-bottom:3px solid transparent;
  font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-selected=true]{color:var(--hanoi);border-bottom-color:var(--hanoi);
  font-weight:700}
.daybar button{display:flex;flex-direction:column;align-items:center;gap:1px}
.daybar button b{font-size:13px;font-weight:700}
.daybar button span{font-size:10.5px;font-weight:600}
/* ---------- agenda ---------- */
.dayhead{padding:16px 16px 4px}
.dayhead h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.015em}
.dayhead p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.metarow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tl{padding:12px 16px 0}
.ses{display:grid;grid-template-columns:56px 1fr;position:relative}
.ses .time{padding:14px 10px 14px 0;text-align:right;font-size:12.5px;font-weight:700;
  color:var(--hanoi);line-height:1.25}
.ses .time small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ses .body{border-left:2px solid var(--line);padding:14px 0 14px 14px;position:relative}
.ses:last-child .body{border-left-color:transparent}
.ses .body::before{content:"";position:absolute;left:-5px;top:20px;width:8px;height:8px;
  background:var(--hanoi);box-shadow:0 0 0 3px var(--bg)}
.ses.break .body::before{background:var(--steel)}
.ses.transfer .body::before{background:var(--gold)}
.ses.culture .body::before{background:var(--red)}
.ses h4{margin:0;font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.ses .det{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ses ul{margin:5px 0 0;padding-left:16px}
.kind{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;margin-bottom:5px}
.kind.transfer{background:var(--gold-t);color:var(--gold-ink)}
.kind.business{background:var(--green-t);color:var(--green-d)}
.kind.culture{background:var(--red-t);color:var(--red-ink)}
.rowtop{display:flex;align-items:flex-start;gap:8px}
.rowtop > div{flex:1;min-width:0}
.star{border:0;background:none;padding:6px;margin:-6px -6px -6px auto;cursor:pointer;
  flex:0 0 auto}
.star svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
.star.on svg{fill:var(--gold);stroke:var(--gold)}
.trk{margin-top:9px;border:1px solid var(--line);background:var(--soft)}
.trk > summary{list-style:none;cursor:pointer;padding:9px 10px;display:flex;align-items:center;
  gap:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.trk > summary::-webkit-details-marker{display:none}
.trk > summary svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.trk > summary svg:last-child{margin-left:auto;transition:transform .18s}
.trk[open] > summary svg:last-child{transform:rotate(180deg)}
.trk .list{padding:0 10px 10px}
.trkitem{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.trkitem .lt{width:22px;height:22px;flex:0 0 22px;background:var(--hanoi);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:800}
.trkitem.pick .lt{background:var(--red)}
.trkitem b{display:block;font-size:12.5px;font-weight:700;line-height:1.3}
.trkitem span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
/* ---------- people & orgs ---------- */
.av{display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto;
  background-size:cover;background-position:center}
.av.sm{width:44px;height:44px;font-size:15px}
.av.md{width:56px;height:56px;font-size:19px}
.av.lg{width:76px;height:76px;font-size:26px}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;
  border:1px solid var(--line);background:var(--card);padding:11px 12px;cursor:pointer;
  color:var(--ink)}
.prow + .prow{margin-top:8px}
.prow .m{flex:1;min-width:0}
.prow .m b{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;
  align-items:center;gap:6px}
.prow .r{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .o{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.prow svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 16px}
.memb{font-size:10px;letter-spacing:-.05em;font-weight:800}
.search{padding:12px 16px 0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);font:inherit;
  font-size:14px;padding:10px 12px 10px 34px;color:var(--ink)}
.search svg{position:absolute;left:26px;top:22px;width:16px;height:16px;stroke:var(--muted);
  fill:none;stroke-width:2}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:var(--card);font:inherit;font-size:12px;
  font-weight:600;padding:6px 10px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
  flex:0 0 auto}
.filters button[aria-pressed=true]{background:var(--hanoi);border-color:var(--hanoi);color:#fff}
/* ---------- detail ---------- */
.dhead{background:linear-gradient(160deg,var(--deep),var(--ink));color:#fff;padding:20px 16px}
.dhead .av{margin-bottom:12px}
.dhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dhead .r{font-size:13.5px;color:var(--cream);font-weight:600;margin-top:4px;line-height:1.4}
.dhead .o{font-size:12.5px;opacity:.8;margin-top:4px}
.facts .f{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts .f:last-child{border-bottom:0}
.facts .k{flex:0 0 104px;font-size:11.5px;color:var(--muted);font-weight:600}
.facts .v{flex:1;font-size:13.5px;min-width:0}
.facts .v a{color:var(--hanoi);word-break:break-word}
.bio{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.hnd{display:flex;gap:8px;flex-wrap:wrap}
.hnd a,.hnd button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:600;
  padding:7px 10px;text-decoration:none;cursor:pointer}
.hnd i{font-style:normal;font-size:10px;font-weight:800;color:var(--hanoi)}
/* ---------- gallery ---------- */
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:12px 16px 0}
.grid3 button{border:0;padding:0;background:var(--soft);cursor:pointer;aspect-ratio:1;
  overflow:hidden}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:absolute;inset:0;background:rgba(6,18,12,.94);z-index:60;display:none;
  flex-direction:column}
.lb.on{display:flex}
.lb .x{align-self:flex-end;margin:10px 12px;background:rgba(255,255,255,.14);border:0;
  color:#fff;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.lb .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.lb img{flex:1;width:100%;object-fit:contain;min-height:0}
.lb .cap{color:#fff;font-size:12.5px;padding:10px 16px 22px;opacity:.8;text-align:center}
.lb .nav{display:flex;gap:8px;justify-content:center;padding:10px 0 0}
.lb .nav button{background:rgba(255,255,255,.14);border:0;color:#fff;padding:8px 22px;
  font:inherit;font-size:16px;font-weight:600;cursor:pointer}
/* ---------- press & docs ---------- */
.prs{display:flex;gap:12px;border:1px solid var(--line);background:var(--card);padding:11px;
  text-decoration:none;color:var(--ink)}
.prs + .prs{margin-top:8px}
.prs img{width:84px;height:56px;flex:0 0 84px;object-fit:cover;background:var(--soft)}
.prs .out{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--hanoi)}
.prs b{display:block;font-size:13px;font-weight:600;line-height:1.35;margin-top:3px}
.doc{display:flex;gap:11px;align-items:center;border:1px solid var(--line);background:var(--card);
  padding:11px;width:100%;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}
.doc + .doc{margin-top:8px}
.doc .ext{width:40px;height:46px;flex:0 0 40px;background:var(--soft);border:1px solid var(--line);
  display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--hanoi)}
.doc b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.doc span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.doc svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 16px}
/* ---------- notifications ---------- */
.nrow{display:flex;gap:11px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;font:inherit;background:none;cursor:pointer;color:var(--ink)}
.nrow.unread{background:var(--soft)}
.nrow .ic{width:32px;height:32px;flex:0 0 32px;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center}
.nrow.unread .ic{background:var(--hanoi);border-color:var(--hanoi)}
.nrow .ic svg{width:16px;height:16px;stroke:var(--hanoi);fill:none;stroke-width:2}
.nrow.unread .ic svg{stroke:#fff}
.nrow b{display:block;font-size:13.5px;font-weight:700}
.nrow p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.nrow .w{font-size:11px;color:var(--muted);flex:0 0 auto}
/* ---------- chat ---------- */
.thread{padding:14px 16px 0;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;font-size:13.5px;line-height:1.45}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.mine{background:var(--hanoi);color:#fff;align-self:flex-end}
.msg .t{display:block;font-size:10px;opacity:.65;margin-top:4px}
.composer{display:flex;gap:8px;padding:12px 16px}
.composer input{flex:1;border:1px solid var(--line);background:var(--card);font:inherit;
  font-size:14px;padding:11px 12px}
.composer button{border:0;background:var(--hanoi);color:#fff;padding:0 14px;cursor:pointer}
.composer button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
/* ---------- meetings ---------- */
.mtg{border:1px solid var(--line);background:var(--card);padding:12px}
.mtg + .mtg{margin-top:8px}
.mtg .hd{display:flex;gap:10px;align-items:center}
.mtg b{font-size:13.5px;font-weight:700}
.mtg .when2{font-size:12.5px;color:var(--hanoi);font-weight:600;margin-top:8px}
.mtg .msg2{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45;
  border-left:2px solid var(--line);padding-left:9px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.slots button{border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;
  font-weight:600;padding:9px;cursor:pointer;color:var(--ink)}
.slots button[aria-pressed=true]{background:var(--hanoi);border-color:var(--hanoi);color:#fff}
/* ---------- forms ---------- */
.f{padding:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.fld label i{color:var(--red);font-style:normal}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);
  background:var(--card);font:inherit;font-size:14px;padding:11px 12px;color:var(--ink)}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--hanoi);
  outline-offset:-2px;border-color:var(--hanoi)}
.fld.err input,.fld.err textarea,.fld.err select,.fld.err .opts{border-color:var(--red)}
.fld .msg{display:none;font-size:11.5px;color:var(--red-ink);font-weight:600;margin-top:4px}
.fld.err .msg{display:block}
.cbx{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;
  color:var(--ink-2);cursor:pointer}
.cbx input{margin-top:3px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--hanoi)}
.opts{border:1px solid var(--line);background:var(--card)}
.opts .cbx{padding:9px 11px;border-bottom:1px solid var(--line);margin:0}
.opts .cbx:last-child{border-bottom:0}
.sw{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  cursor:pointer}
.sw:last-child{border-bottom:0}
.sw .lb2{flex:1;font-size:13.5px}
.sw .lb2 small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.sw input{width:18px;height:18px;accent-color:var(--hanoi);flex:0 0 auto}
/* ---------- me ---------- */
.me{background:linear-gradient(160deg,var(--deep),var(--ink));color:#fff;padding:20px 16px}
.me .top2{display:flex;gap:13px;align-items:center}
.me b{font-size:18px;font-weight:800;letter-spacing:-.015em;display:block}
.me span{font-size:12.5px;opacity:.78;display:block;margin-top:2px}
.qr{display:grid;grid-template-columns:repeat(29,1fr);width:190px;height:190px;margin:0 auto;
  background:#fff;padding:6px;border:1px solid var(--line)}
.qr i{display:block}
.done{padding:24px 12px;text-align:center}
.done .ok{width:56px;height:56px;margin:0 auto 14px;background:var(--green-t);display:grid;
  place-items:center}
.done .ok svg{width:28px;height:28px;stroke:var(--hanoi);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.done h3{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:-.015em}
.done p{font-size:13.5px;color:var(--muted);line-height:1.6;white-space:pre-line}
/* ---------- sheet ---------- */
.sheet{position:absolute;inset:0;background:rgba(11,31,22,.5);display:none;z-index:50;
  align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-height:88%;overflow-y:auto;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.toast{position:absolute;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;z-index:70;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.src{padding:14px 16px 22px;font-size:11px;color:var(--muted);line-height:1.55;
  border-top:1px solid var(--line);margin-top:18px}
.src a{color:var(--hanoi)}
</style>

   deliberately not pretending there is a backend behind it.
   ========================================================================= */
var KEY = "svef.hanoi.app";
var S = load();
function load(){
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){}
  var base = {
    reg:null,        /* raw RSVP answers, keyed by the live form's own field ids */
    profile:null,    /* derived from reg on first read, then editable */
    vis:{dir:true,org:true,email:false,phone:false,bio:true,li:true,web:true},
    orgClaim:{state:"none",oid:null},
    saved:[], picks:{}, conns:{},
    meetings:null, chats:null, readNotifs:[]
  };
  if(raw) for(var k in raw) base[k] = raw[k];
  if(!base.meetings) base.meetings = JSON.parse(JSON.stringify(D.meetings || []));
  if(!base.chats) base.chats = JSON.parse(JSON.stringify(D.chats || {}));
  return base;
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- the prefilled profile ----------
   The delegate answered 19 questions at registration. Asking them again inside the
   app would be the most irritating thing this build could do, so the profile is
   derived from those answers. `profileMap` resolves the live form's field ids by
   LABEL at scrape time, because Wix regenerates the custom-* ids whenever a
   question is edited and a stale id would produce a silently empty profile. */
var PM = D.profileMap || {};
function regVal(key){
  if(!S.reg) return "";
  var id = PM[key];
  return id ? (S.reg[id] || "") : "";
}
function initialsOf(name){
  var parts = String(name||"").trim().split(/\s+/);
  var a = (parts[0]||"")[0] || "", b = parts.length>1 ? (parts[parts.length-1]||"")[0] : "";
  return (a+b).toUpperCase() || "D";
}
function buildProfile(){
  var name = [regVal("firstName"), regVal("lastName")].filter(Boolean).join(" ").trim();
  return {
    name:name || "Delegate", initials:initialsOf(name),
    email:regVal("email"), phone:regVal("phone"), country:regVal("country"),
    role:regVal("jobTitle"), org:regVal("org"),
    sectors:String(regVal("sectors")||"").split(", ").filter(Boolean),
    delegation:regVal("delegation"), day3:regVal("day3"),
    membership:regVal("membership"), support:regVal("support"),
    directory:regVal("directory"), sponsor:regVal("sponsor"),
    dietary:regVal("dietary"), questions:regVal("questions"),
    bio:"", li:"", web:""
  };
}
function me(){
  if(!S.reg) return null;
  if(!S.profile){ S.profile = buildProfile(); persist(); }
  return S.profile;
}
/* The registration question "Would you like to be featured in the SVEF 2026
   Delegates Directory?" is the real opt-in, so it is what gates the directory
   rather than a second setting invented for the app. */
function inDirectory(){
  var p = me();
  return !!p && S.vis.dir && /^yes/i.test(p.directory || "");
}
/* The two parallel-session radios resolve back to real agenda tracks. */
function regTrack(which){
  var v = regVal(which);
  var m = v && /^Session\s+([A-F])/i.exec(v);
  return m ? (D.tracks[m[1].toUpperCase()] || null) : null;
}

/* ---------- people & orgs ---------- */
var PEOPLE = D.people || [], ORGS = D.orgs || [];
function personById(id){ id = +id;
  return PEOPLE.filter(function(p){ return p.id===id; })[0] || null; }
function orgById(id){ return ORGS.filter(function(o){ return o.id===id; })[0] || null; }
function orgOf(p){ return p && p.oid ? orgById(p.oid) : null; }
function repsOf(o){ return PEOPLE.filter(function(p){ return p.oid===o.id; }); }
function tierOf(p){ return (p && p.tier) || "guest"; }
function tierRank(k){ return ((D.taxonomy.tiers[k]||{}).rank)||1; }
function membHTML(tier){
  var tt = D.taxonomy.tiers[tier];
  if(!tt || !tt.star) return "";
  var col = tierRank(tier)>=3 ? "var(--gold-ink)" : "var(--red-ink)";
  return '<span class="memb" style="color:'+col+'" title="'+esc(tx(tt))+'">'+tt.star+'</span>';
}
/* A delegate who did not opt into the directory is still listed, but is not
   contactable, and the app says why rather than hiding the button unexplained. */
function canConnect(p){
  if(!p) return {ok:false,why:""};
  return p.dir ? {ok:true,why:""} : {ok:false,why:t("cannotConnect")};
}
function connState(id){ return S.conns[String(id)] || "none"; }
function avHTML(o,cls){
  cls = cls || "sm";
  if(o && o.photo)
    return '<div class="av '+cls+'" style="background-image:url('+esc(o.photo)+')"></div>';
  return '<div class="av '+cls+'" style="background:'+esc((o&&o.c)||"#04723D")+'">'+
    esc((o&&(o.i||o.initials))||"?")+'</div>';
}
function fact(k,v){ return '<div class="f"><div class="k">'+esc(k)+'</div><div class="v">'+
  v+'</div></div>'; }

/* ---------- dates & countdown ---------- */
function counts(){
  var ms = new Date(E.start) - new Date();
  if(ms<0) ms = 0;
  var s = Math.floor(ms/1000);
  return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}
function fdate(iso){
  if(!iso) return "";
  return new Date(iso.length>10?iso:iso+"T00:00:00")
    .toLocaleDateString(lang==="vi"?"vi-VN":"en-GB",
      {day:"numeric",month:"short",weekday:"short"});
}
function flong(iso){
  if(!iso) return "";
  return new Date(iso).toLocaleDateString(lang==="vi"?"vi-VN":"en-GB",
    {day:"numeric",month:"long",year:"numeric"});
}

/* ---------- notifications ---------- */
function notifs(){
  return (D.notifications||[]).map(function(n){
    var o = {}; for(var k in n) o[k] = n[k];
    o.unread = n.unread && S.readNotifs.indexOf(n.id)<0;
    return o;
  });
}
function unreadCount(){ return notifs().filter(function(n){ return n.unread; }).length; }
function pendingMeetings(){
  return S.meetings.filter(function(m){
    return m.status==="pending" && m.dir==="received"; }).length;
}

/* =========================================================================
   Navigation: five tabs plus a push stack, so Back means something instead of
   dumping the delegate on Home.
   ========================================================================= */
var TABS = ["home","agenda","connect","media","me"];
var view = "home", stack = [], day = 2;
var connectTab = "delegates", mediaTab = "gallery", meTab = "profile";
var q = "", filt = {ind:"",mkt:""}, chatWith = null, curPerson = null, curOrg = null;
var lbIdx = 0;

function snapshot(){ return {view:view,day:day,connectTab:connectTab,mediaTab:mediaTab,
  meTab:meTab,chatWith:chatWith,curPerson:curPerson,curOrg:curOrg}; }
function go(v,push){
  if(push) stack.push(snapshot());
  view = v; el("screens").scrollTop = 0; render();
}
function back(){
  var s = stack.pop();
  if(s){ view=s.view; day=s.day; connectTab=s.connectTab; mediaTab=s.mediaTab;
         meTab=s.meTab; chatWith=s.chatWith; curPerson=s.curPerson; curOrg=s.curOrg; }
  else view = "home";
  el("screens").scrollTop = 0; render();
}
function tab(v){ stack = []; go(v); }

/* ---- Agenda ---- */
function sesHTML(s){
  var cls = s.kind && s.kind!=="session" ? " "+esc(s.kind) : "";
  if(/break|coffee/i.test(s.title)) cls += " break";
  var h = '<div class="ses'+cls+'">';
  h += '<div class="time">'+esc(s.start||"")+(s.end?'<small>'+esc(s.end)+'</small>':'')+'</div>';
  h += '<div class="body"><div class="rowtop"><div>';
  if(s.kind && s.kind!=="session")
    h += '<span class="kind '+esc(s.kind)+'">'+esc(s.kind)+'</span>';
  h += '<h4>'+esc(s.title)+'</h4></div>';
  h += '<button class="star'+(S.saved.indexOf(s.id)>-1?" on":"")+'" data-star="'+esc(s.id)+
       '" aria-label="Save">'+ico(I.star)+'</button></div>';
  if(s.detail && s.detail.length){
    h += s.detail.length>1
      ? '<ul class="det">'+s.detail.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'
      : '<p class="det">'+esc(s.detail[0])+'</p>';
  }
  if(s.tracks && s.tracks.length){
    var picked = S.picks[s.id];
    h += '<details class="trk"'+(picked?" open":"")+'><summary>'+t("pick")+
         ' ('+s.tracks.length+')'+ico(I.chev)+'</summary><div class="list">';
    s.tracks.forEach(function(tr){
      h += '<div class="trkitem'+(picked===tr.track?" pick":"")+'" data-pick="'+esc(s.id)+
           '|'+esc(tr.track)+'"><span class="lt">'+esc(tr.track)+'</span><div><b>'+
           esc(tr.title)+'</b>'+(tr.summary?'<span>'+esc(tr.summary)+'</span>':'')+
           (picked===tr.track?'<span style="color:var(--red-ink);font-weight:700">'+
             t("picked")+'</span>':'')+'</div></div>';
    });
    h += '</div></details>';
  }
  return h + '</div></div>';
}
function agendaHTML(){
  var h = '<div class="seg daybar">';
  D.days.forEach(function(d){
    h += '<button data-day="'+d.day+'" aria-selected="'+(d.day===day)+'"><b>'+
      t("day")+' '+d.day+'</b><span>'+esc(fdate(d.date))+'</span></button>';
  });
  h += '</div>';
  var d = D.days.filter(function(x){ return x.day===day; })[0];
  if(!d) return h;
  h += '<div class="dayhead"><h2>'+esc(d.title)+'</h2><div class="metarow">';
  var v = d.meta.venue && !/updated/i.test(d.meta.venue) ? d.meta.venue : null;
  h += '<span class="chip'+(v?"":" tbd")+'">'+t("venue")+': '+esc(v||t("tbd"))+'</span>';
  if(d.meta.format) h += '<span class="chip on">'+esc(d.meta.format)+'</span>';
  if(d.meta.expected_participation)
    h += '<span class="chip">'+esc(d.meta.expected_participation)+'</span>';
  h += '</div>';
  if(d.intro) h += '<p>'+esc(d.intro)+'</p>';
  h += '</div><div class="tl">'+d.sessions.map(sesHTML).join("")+'</div>';
  return h + srcHTML();
}

/* ---- Connect ---- */
function personRow(p){
  var o = orgOf(p), st = connState(p.id);
  return '<button class="prow" data-person="'+p.id+'">'+avHTML(p,"sm")+
    '<div class="m"><b>'+esc(p.n)+membHTML(tierOf(p))+
      (p.speaker?' <span class="chip on" style="font-size:9.5px;padding:1px 5px">'+
        t("keynote")+'</span>':'')+'</b>'+
    '<span class="r">'+esc(tx(p.t))+'</span>'+
    (o?'<span class="o">'+esc(o.n)+'</span>':'')+'</div>'+
    (st==="linked" ? '<span class="chip on">'+t("connected")+'</span>'
     : st==="sent" ? '<span class="chip gold">'+t("pendingC")+'</span>'
     : (!p.dir ? '<span class="chip">'+t("optedOut")+'</span>' : ico(I.chev)))+
    '</button>';
}
function orgRow(o){
  return '<button class="prow" data-org="'+esc(o.id)+'">'+
    (o.logo ? '<div class="av sm" style="background:#fff;background-image:url('+esc(o.logo)+
        ');background-size:contain;background-repeat:no-repeat;border:1px solid var(--line)"></div>'
      : '<div class="av sm" style="background:'+esc(o.c)+'">'+esc(o.i)+'</div>')+
    '<div class="m"><b>'+esc(o.n)+membHTML(o.tier)+'</b>'+
    '<span class="r">'+esc(tx(D.taxonomy.industries[o.ind]))+'</span>'+
    '<span class="o">'+esc(tx(o.hq))+'</span></div>'+
    (o.demo ? ico(I.chev) : '<span class="chip on">'+t("organisers")+'</span>')+'</button>';
}
function matchQ(p){
  if(!q) return true;
  var o = orgOf(p);
  return [p.n, tx(p.t), o?o.n:"", tx(p.bio)].join(" ").toLowerCase()
    .indexOf(q.toLowerCase())>-1;
}
function connectHTML(){
  var h = '<div class="seg">';
  [["delegates",t("delegates")],["speakers",t("speakers")],["orgs",t("orgs")],
   ["mine",t("mine")]].forEach(function(p){
    h += '<button data-ctab="'+p[0]+'" aria-selected="'+(connectTab===p[0])+'">'+
         esc(p[1])+'</button>';
  });
  h += '</div>';

  if(connectTab==="orgs"){
    h += '<div class="pad" style="padding-top:12px">';
    ORGS.slice().sort(function(a,b){ return tierRank(b.tier)-tierRank(a.tier); })
        .forEach(function(o){ h += orgRow(o); });
    h += '</div>';
    return h + demoNote(tx(D.demoNotice)) + srcHTML();
  }

  if(connectTab==="mine"){
    var mine = PEOPLE.filter(function(p){ return connState(p.id)!=="none"; });
    h += '<div class="sec"><h3>'+t("connected")+' ('+mine.length+')</h3></div><div class="pad">';
    h += mine.length ? mine.map(personRow).join("")
       : '<div class="empty">'+t("noConns")+'</div>';
    h += '</div>';
    h += '<div class="sec"><h3>'+t("meetings")+
      '<button class="lnk" data-go="meetings">'+t("viewAll")+' &rsaquo;</button></h3></div>';
    h += '<div class="pad">'+meetingCards(S.meetings.slice(0,2))+'</div>';
    h += '<div class="sec"><h3>'+t("messages")+
      '<button class="lnk" data-go="messages">'+t("viewAll")+' &rsaquo;</button></h3></div>';
    h += '<div class="pad">'+threadList(2)+'</div>';
    return h + srcHTML();
  }

  var list = PEOPLE.filter(function(p){
    if(connectTab==="speakers" && !p.speaker) return false;
    if(connectTab==="delegates" && p.speaker) return false;
    if(filt.ind && p.ind!==filt.ind) return false;
    if(filt.mkt && (p.mkts||[]).indexOf(filt.mkt)<0) return false;
    return matchQ(p);
  });
  h += '<div class="search">'+ico(I.srch)+'<input id="q" type="text" value="'+esc(q)+
       '" placeholder="'+t("search")+'"></div>';
  if(connectTab==="delegates"){
    h += '<div class="filters"><button data-ind="" aria-pressed="'+(!filt.ind)+'">'+
         t("all")+'</button>';
    Object.keys(D.taxonomy.industries).forEach(function(k){
      if(!PEOPLE.some(function(p){ return p.ind===k && !p.speaker; })) return;
      h += '<button data-ind="'+k+'" aria-pressed="'+(filt.ind===k)+'">'+
           esc(tx(D.taxonomy.industries[k]))+'</button>';
    });
    h += '</div><div class="filters"><button data-mkt="" aria-pressed="'+(!filt.mkt)+'">'+
         t("markets")+': '+t("all")+'</button>';
    Object.keys(D.taxonomy.markets).forEach(function(k){
      h += '<button data-mkt="'+k+'" aria-pressed="'+(filt.mkt===k)+'">'+
           esc(tx(D.taxonomy.markets[k]))+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="pad" style="padding-top:12px">';
  h += list.length ? list.map(personRow).join("") : '<div class="empty">'+t("noResults")+'</div>';
  h += '</div>';
  if(connectTab==="speakers"){
    h += '<div class="sec"><div class="empty">'+
      esc(t("speakersNote").replace("{n}", D.speakers.length))+'</div></div>';
    return h + srcHTML();
  }
  return h + demoNote(tx(D.demoNotice)) + srcHTML();
}

    h += '<button class="btn green sm" data-chat="'+p.id+'">'+ico(I.chat)+t("message")+'</button>';
    h += '<button class="btn ghost sm" data-book="'+p.id+'">'+ico(I.hand)+
         t("bookMeeting")+'</button>';

  h += '</div>';

  h += '</div>';

  if(tx(p.bio)) h += '<div class="sec"><div class="card"><p class="bio" style="margin:0">'+
    esc(tx(p.bio))+'</p></div></div>';

  h += '<div class="sec"><div class="card facts">';
  if(o) h += fact(t("business"),

/* ---- Meetings ---- */
function meetingCards(list){
  if(!list.length) return '<div class="empty">'+t("noMeetings")+'</div>';
  var lbl = {confirmed:t("mtgConfirmed"),pending:t("mtgPending"),
             declined:t("mtgDeclined"),canceled:t("mtgCanceled")};
  var cls = {confirmed:"on",pending:"gold",declined:"",canceled:"red"};
  return list.map(function(m){
    var p = personById(m.pid); if(!p) return "";
    var h = '<div class="mtg"><div class="hd">'+avHTML(p,"sm")+
      '<div style="flex:1;min-width:0"><b>'+esc(p.n)+'</b>'+
      '<div style="font-size:12px;color:var(--muted)">'+esc(tx(p.t))+'</div></div>'+
      '<span class="chip '+cls[m.status]+'">'+esc(lbl[m.status])+'</span></div>';
    h += '<div class="when2">'+t("day")+' '+m.day+' · '+esc(m.time)+
      (m.place?' · '+esc(tx(m.place)):'')+'</div>';
    if(m.msg) h += '<div class="msg2">'+esc(tx(m.msg))+'</div>';
    if(m.status==="pending" && m.dir==="received"){
      h += '<div class="row2" style="margin-top:10px">'+
        '<button class="btn green sm" data-mtg="accept|'+m.pid+'">'+ico(I.check)+
        t("accept")+'</button><button class="btn ghost sm" data-mtg="decline|'+m.pid+'">'+
        ico(I.x)+t("decline")+'</button></div>';
    } else if(m.status==="confirmed" || (m.status==="pending" && m.dir==="sent")){
      h += '<div style="margin-top:10px"><button class="btn ghost sm" data-mtg="cancel|'+
        m.pid+'" style="width:100%">'+t("cancelMtg")+'</button></div>';
    }
    return h + '</div>';
  }).join("");
}

/* ---- Registration: the live 19-field RSVP form ---- */
function fieldHTML(f){
  var req = f.required ? ' <i>*</i>' : '';
  var id = "f_"+f.id, opts = f.options || [];
  var h = '<div class="fld" data-fid="'+esc(f.id)+'" data-ctl="'+esc(f.control)+'"'+
          (f.required?' data-req="1"':'')+'>';
  h += '<label'+(f.control==="RADIO"||f.control==="CHECKBOX"?"":' for="'+id+'"')+'>'+
       esc(f.label)+req+'</label>';
  if(f.control==="CHECKBOX" && opts.length){
    h += '<div class="opts">'+opts.map(function(o){
      return '<label class="cbx"><input type="checkbox" name="'+id+'" value="'+esc(o)+'">'+
        '<span>'+esc(o)+'</span></label>'; }).join("")+'</div>';
  } else if(f.control==="CHECKBOX"){
    h += '<label class="cbx"><input type="checkbox" id="'+id+'"><span>'+
      (lang==="vi"?"Tôi đồng ý":"I agree")+'</span></label>';
  } else if(opts.length){
    h += '<div class="opts">'+opts.map(function(o){
      return '<label class="cbx"><input type="radio" name="'+id+'" value="'+esc(o)+'">'+
        '<span>'+esc(o)+'</span></label>'; }).join("")+'</div>';
  } else if(f.control==="TEXTAREA"){
    h += '<textarea id="'+id+'" maxlength="'+(f.maxLength||2000)+'"></textarea>';
  } else {
    var ty = /email/i.test(f.id) ? "email" : (/phone/i.test(f.label) ? "tel" : "text");
    h += '<input type="'+ty+'" id="'+id+'" maxlength="'+(f.maxLength||255)+'">';
  }
  return h + '<div class="msg">'+t("required")+'</div></div>';
}
function regHTML(){

      h += '<div style="margin-top:10px">'+orgRow(match)+'</div>';
    } else {
      h += '<div class="card"><div style="font-size:11px;font-weight:700;letter-spacing:.1em;'+
        'color:var(--muted);text-transform:uppercase">'+t("business")+'</div>'+
        '<b style="display:block;font-size:16px;font-weight:800;margin:5px 0 6px">'+
        esc(p.org || "—")+'</b><p style="margin:0;font-size:12.5px;color:var(--muted);'+
        'line-height:1.5">'+t("orgNoMatch")+'</p>';
      var cs = S.orgClaim;
      if(cs.state==="pending")
        h += '<div class="chip gold" style="margin-top:10px">'+t("claimPending")+'</div>';
      else if(cs.state==="linked")
        h += '<div class="chip on" style="margin-top:10px">'+t("claimLinked")+'</div>';
      else h += '<button class="btn green sm" style="width:100%;margin-top:10px" '+
        'data-claim="new">'+ico(I.bldg)+t("claimOrg")+'</button>';
      h += '</div>';
    }
    h += '</div><div class="sec"><h3>'+t("orgs")+'</h3></div><div class="pad">';
    ORGS.slice(0,6).forEach(function(o){ h += orgRow(o); });
    h += '<button class="btn ghost sm" style="width:100%;margin-top:10px" data-ctab="orgs">'+
      t("viewAll")+'</button></div>';
    return h + srcHTML();
  }

  if(meTab==="myagenda"){
    h += '<div class="sec"><h3>'+t("myagenda")+'</h3></div><div class="pad">';
    var any = false;
    D.days.forEach(function(d){
      d.sessions.forEach(function(s){
        if(S.saved.indexOf(s.id)<0) return;
        any = true;
        h += '<button class="card" data-day="'+d.day+'" style="width:100%;text-align:left;'+
          'font:inherit;cursor:pointer;display:block"><div style="font-size:11px;'+
          'font-weight:700;color:var(--hanoi);letter-spacing:.08em">'+t("day").toUpperCase()+
          ' '+d.day+' · '+esc(s.start||"")+'</div><div style="font-size:14px;font-weight:700;'+
          'margin-top:3px">'+esc(s.title)+'</div>'+
          (S.picks[s.id]?'<div style="font-size:12px;color:var(--muted);margin-top:3px">'+
            t("picked")+': '+esc(S.picks[s.id])+'</div>':'')+'</button>';
      });
    });
    if(!any) h += '<div class="empty">'+t("nostar")+'</div>';
    return h + '</div>' + srcHTML();
  }

  /* visibility */
  h += '<div class="sec"><div class="card">'+
    '<p style="margin:0 0 4px;font-size:12.5px;color:var(--muted);line-height:1.5">'+
    t("visNote")+'</p>';
  [["dir",t("visDir"),p.directory||""],["org",t("visOrg"),p.org||""],
   ["email",t("visEmail"),p.email||""],["phone",t("visPhone"),p.phone||""],
   ["bio",t("visBio"),""],["li","LinkedIn",""],["web",t("web"),""]].forEach(function(r){
    h += '<label class="sw"><span class="lb2">'+esc(r[1])+
      (r[2]?'<small>'+esc(r[2])+'</small>':'')+'</span>'+
      '<input type="checkbox" data-vis="'+r[0]+'"'+(S.vis[r[0]]?" checked":"")+'></label>';
  });
  h += '</div></div>';
  h += '<div class="sec"><div class="card"><div style="font-size:12px;font-weight:700;'+
    'color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">'+
    t("dirStatus")+'</div>'+(inDirectory()
      ? '<div class="chip on">'+t("dirVisible")+'</div>'
      : '<div class="chip">'+t("dirHidden")+'</div>')+'</div></div>';
  return h + srcHTML();
}

/* =========================================================================
   Render
   ========================================================================= */
var SCREENS = {
  home:homeHTML, agenda:agendaHTML, connect:connectHTML, media:mediaHTML, me:meHTML,
  info:infoHTML, notifs:notifsHTML, messages:messagesHTML, chat:chatHTML,
  meetings:meetingsHTML, person:personHTML, org:orgHTML, reg:regHTML,
  editprofile:editProfileHTML
};
var TITLES = {
  home:function(){ return E.title; }, agenda:function(){ return t("agenda"); },
  connect:function(){ return t("connect"); }, media:function(){ return t("media"); },
  me:function(){ return me() ? t("me") : t("register"); },
  info:function(){ return t("overview"); }, notifs:function(){ return t("notifications"); },
  messages:function(){ return t("messages"); },
  chat:function(){ var p = personById(chatWith); return p ? p.n : t("messages"); },
  meetings:function(){ return t("meetings"); },
  person:function(){ var p = personById(curPerson); return p ? p.n : ""; },
  org:function(){ var o = orgById(curOrg); return o ? o.n : ""; },
  reg:function(){ return t("register"); },
  editprofile:function(){ return t("editProfile"); }
};

function render(){
  el("screens").innerHTML = (SCREENS[view] || homeHTML)();
  el("ttl").textContent = TITLES[view] ? TITLES[view]() : "";
  el("sub").textContent = view==="home"
    ? (lang==="vi"?E.displayDatesVi:E.displayDates)+" · "+E.city : E.title;
  el("back").hidden = stack.length===0;
  el("lang").textContent = lang==="en" ? "VI" : "EN";
  var un = unreadCount();
  el("bdot").hidden = !un; el("bdot").textContent = un;
  var pm = pendingMeetings();
  el("tabs").innerHTML = [["home",I.home],["agenda",I.cal],["connect",I.net],
                          ["media",I.img],["me",I.user]].map(function(p){
    return '<button class="tab" role="tab" data-tab="'+p[0]+'" aria-selected="'+
      (view===p[0])+'">'+ico(p[1])+'<span>'+t(p[0])+'</span>'+
      (p[0]==="connect" && pm ? '<span class="bdg">'+pm+'</span>' : '')+'</button>';
  }).join("");
  if(view==="chat"){ var sc = el("screens"); sc.scrollTop = sc.scrollHeight; }
}
function toast(m){
  var x = el("toast"); x.textContent = m; x.classList.add("on");
  clearTimeout(x._t); x._t = setTimeout(function(){ x.classList.remove("on"); }, 1900);
}

/* =========================================================================
   Events
   ========================================================================= */
document.addEventListener("click", function(ev){
  var n;
  if((n = ev.target.closest("[data-tab]"))){ tab(n.getAttribute("data-tab")); return; }
  if((n = ev.target.closest("[data-go]"))){
    var v = n.getAttribute("data-go");
    if(TABS.indexOf(v)>-1) tab(v); else go(v,true);
    return;
  }
  if((n = ev.target.closest("[data-day]"))){
    day = +n.getAttribute("data-day");
    if(view!=="agenda"){ stack = []; go("agenda"); } else render();
    return;
  }
  if((n = ev.target.closest("[data-ctab]"))){
    connectTab = n.getAttribute("data-ctab"); q = ""; filt = {ind:"",mkt:""};
    if(view!=="connect"){ stack = []; go("connect"); } else render();
    return;
  }
  if((n = ev.target.closest("[data-mtab]"))){
    mediaTab = n.getAttribute("data-mtab"); render(); return; }
  if((n = ev.target.closest("[data-media]"))){
    mediaTab = n.getAttribute("data-media"); tab("media"); return; }
  if((n = ev.target.closest("[data-metab]"))){
    meTab = n.getAttribute("data-metab"); render(); return; }
  if((n = ev.target.closest("[data-ind]"))){
    filt.ind = n.getAttribute("data-ind"); render(); return; }
  if((n = ev.target.closest("[data-mkt]"))){
    filt.mkt = n.getAttribute("data-mkt"); render(); return; }
  if((n = ev.target.closest("[data-person]"))){
    curPerson = +n.getAttribute("data-person"); go("person",true); return; }
  if((n = ev.target.closest("[data-org]"))){
    curOrg = n.getAttribute("data-org"); go("org",true); return; }
  if((n = ev.target.closest("[data-star]"))){
    ev.preventDefault();
    var sid = n.getAttribute("data-star"), i = S.saved.indexOf(sid);
    if(i>-1) S.saved.splice(i,1); else S.saved.push(sid);
    persist(); render(); return;
  }
  if((n = ev.target.closest("[data-pick]"))){
    var a = n.getAttribute("data-pick").split("|");
    if(S.picks[a[0]]===a[1]) delete S.picks[a[0]];
    else { S.picks[a[0]] = a[1]; if(S.saved.indexOf(a[0])<0) S.saved.push(a[0]); }
    persist(); render(); return;
  }
  if((n = ev.target.closest("[data-conn]"))){
    var pid = n.getAttribute("data-conn");
    S.conns[pid] = "sent"; persist(); render(); toast(t("connSent"));
    /* The other side accepts a moment later so the rest of the flow is reachable
       in a demo without a second device and a second person. */
    setTimeout(function(){
      S.conns[pid] = "linked";
      if(!S.chats[pid]) S.chats[pid] = [];
      persist();
      if(view==="person" || view==="connect") render();
      toast(t("connected"));
    }, 1500);
    return;
  }
  if((n = ev.target.closest("[data-chat]"))){
    chatWith = +n.getAttribute("data-chat");
    if(!S.chats[String(chatWith)]) S.chats[String(chatWith)] = [];
    persist(); go("chat",true); return;
  }
  if((n = ev.target.closest("[data-book]"))){ bookSheet(+n.getAttribute("data-book")); return; }
  if((n = ev.target.closest("[data-mtg]"))){
    var m2 = n.getAttribute("data-mtg").split("|");
    S.meetings.forEach(function(m){
      if(m.pid!==+m2[1]) return;
      m.status = m2[0]==="accept" ? "confirmed" : m2[0]==="decline" ? "declined" : "canceled";
    });
    persist(); render();
    toast(m2[0]==="accept" ? t("mtgConfirmed")
        : m2[0]==="decline" ? t("mtgDeclined") : t("mtgCanceled"));
    return;
  }
  if((n = ev.target.closest("[data-vcard]"))){ vcard(+n.getAttribute("data-vcard")); return; }
  if((n = ev.target.closest("[data-copy]"))){
    var val = n.getAttribute("data-copy");
    if(navigator.clipboard) navigator.clipboard.writeText(val);
    toast(t("copied")); return;
  }
  if((n = ev.target.closest("[data-claim]"))){
    var oid = n.getAttribute("data-claim");
    S.orgClaim = {state:"pending", oid: oid==="new" ? null : oid};
    persist(); render(); toast(t("claimPending")); return;
  }
  if((n = ev.target.closest("[data-notif]"))){
    var nid = n.getAttribute("data-notif");
    if(S.readNotifs.indexOf(nid)<0) S.readNotifs.push(nid);
    persist();
    var rec = (D.notifications||[]).filter(function(x){ return x.id===nid; })[0];
    if(rec && rec.go){
      if(TABS.indexOf(rec.go)>-1) tab(rec.go);
      else if(rec.go==="press"){ mediaTab = "press"; tab("media"); }
      else go(rec.go,true);
    } else render();
    return;
  }
  if((n = ev.target.closest("[data-photo]"))){ openLb(+n.getAttribute("data-photo")); return; }
  if(ev.target.closest("[data-doc]")){ toast(t("noFile")); return; }
  if(ev.target.id==="markall"){
    (D.notifications||[]).forEach(function(x){
      if(S.readNotifs.indexOf(x.id)<0) S.readNotifs.push(x.id); });
    persist(); render(); return;
  }
  if(ev.target.id==="qrbtn"){ qrSheet(); return; }
  if(ev.target.id==="resetreg"){
    S.reg = null; S.profile = null; S.conns = {}; S.orgClaim = {state:"none",oid:null};
    persist(); meTab = "profile"; tab("me"); return;
  }
  if(ev.target.id==="pcancel"){ back(); return; }
  if(ev.target.closest(".sheet") && !ev.target.closest(".sheet .in")) closeSheet();
});

el("bell").addEventListener("click", function(){ if(view!=="notifs") go("notifs",true); });
el("lang").addEventListener("click", function(){
  lang = lang==="en" ? "vi" : "en";
  localStorage.setItem("svef.hanoi.lang", lang);
  render();
});
document.addEventListener("input", function(ev){
  if(ev.target.id==="q"){
    q = ev.target.value;
    var pos = ev.target.selectionStart;
    render();
    var qi = el("q");
    if(qi){ qi.focus(); qi.setSelectionRange(pos,pos); }
  }
});
document.addEventListener("change", function(ev){
  var tg = ev.target;
  if(tg.getAttribute && tg.getAttribute("data-vis")){
    S.vis[tg.getAttribute("data-vis")] = tg.checked; persist(); render();
  }
});
document.addEventListener("submit", function(ev){
  if(ev.target.id==="regform"){ ev.preventDefault(); submitReg(ev.target); }
  else if(ev.target.id==="pform"){ ev.preventDefault(); saveProfile(); }
  else if(ev.target.id==="cform"){ ev.preventDefault(); sendMsg(); }
});

function submitReg(form){
  var ok = true, vals = {};
  form.querySelectorAll(".fld").forEach(function(fl){
    var group = fl.querySelectorAll(".opts input"), v;
    if(group.length){
      v = [].filter.call(group,function(i){ return i.checked; })
            .map(function(i){ return i.value; }).join(", ");
    } else {
      var input = fl.querySelector("input,textarea,select");
      if(!input) return;
      v = input.type==="checkbox" ? (input.checked?"yes":"") : input.value.trim();
    }
    vals[fl.getAttribute("data-fid")] = v;
    var inp = fl.querySelector("input,textarea,select");
    var bad = fl.hasAttribute("data-req") && !v;
    if(!bad && inp && inp.type==="email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      bad = true; fl.querySelector(".msg").textContent = t("invalid");
    } else if(bad){ fl.querySelector(".msg").textContent = t("required"); }
    fl.classList.toggle("err", bad);
    if(bad && ok){ ok = false; fl.scrollIntoView({block:"center"}); }
  });
  if(!ok) return;
  S.reg = vals; S.profile = null;
  /* The two parallel-session answers are agenda choices, so they land in My agenda
     rather than sitting in a form record the delegate never sees again. */
  ["round1","round2"].forEach(function(w){
    var tr = regTrack(w);
    if(!tr) return;
    S.picks[tr.sessionId] = tr.track;
    if(S.saved.indexOf(tr.sessionId)<0) S.saved.push(tr.sessionId);
  });
  persist();
  var conf = R.confirmation || {};
  el("sheetin").innerHTML = '<div class="grab"></div><div class="done">'+
    '<div class="ok">'+ico(I.check)+'</div><h3>'+esc(conf.title||"Thank you")+'</h3>'+
    '<p>'+esc(conf.message||"")+'</p><button class="btn green" id="sheetok" '+
    'style="margin-top:16px">'+t("seeProfile")+'</button></div>';
  el("sheet").classList.add("on");
  el("sheetok").onclick = function(){ closeSheet(); meTab = "profile"; tab("me"); };
}
function saveProfile(){
  var p = me(); if(!p) return;
  ["name","role","org","email","phone","country","li","web"].forEach(function(k){
    var i = el("p_"+k); if(i) p[k] = i.value.trim();
  });
  var b = el("p_bio"); if(b) p.bio = b.value.trim();
  p.initials = initialsOf(p.name);
  S.profile = p; persist(); back(); toast(t("save"));
}
function sendMsg(){
  var i = el("cmsg");
  if(!i || !i.value.trim()) return;
  var k = String(chatWith);
  if(!S.chats[k]) S.chats[k] = [];
  var now = new Date();
  S.chats[k].push({me:true, t:("0"+now.getHours()).slice(-2)+":"+
    ("0"+now.getMinutes()).slice(-2), m:{en:i.value.trim(), vi:i.value.trim()}});
  persist(); render();
}

/* ---- sheets ---- */
function closeSheet(){ el("sheet").classList.remove("on"); }
function bookSheet(pid){
  var p = personById(pid); if(!p) return;
  var chosen = null, o = orgOf(p);
  var h = '<div class="grab"></div><h3>'+t("bookMeeting")+'</h3>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">'+esc(p.n)+
    (o?' · '+esc(o.n):'')+'</div>'+
    '<div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px">'+
    t("pickSlot")+'</div><div class="slots" id="slots">';
  (D.slots||[]).forEach(function(s,i){
    h += '<button data-slot="'+i+'" aria-pressed="false">'+esc(s)+'</button>';
  });
  h += '</div><button class="btn green" id="bookgo" style="margin-top:14px" disabled>'+
    t("sendRequest")+'</button>';
  el("sheetin").innerHTML = h;
  el("sheet").classList.add("on");
  el("slots").addEventListener("click", function(e){
    var b = e.target.closest("[data-slot]"); if(!b) return;
    chosen = +b.getAttribute("data-slot");
    [].forEach.call(el("slots").children, function(x,i){
      x.setAttribute("aria-pressed", i===chosen ? "true" : "false"); });
    el("bookgo").disabled = false;
  });
  el("bookgo").onclick = function(){
    S.meetings.unshift({pid:p.id, status:"pending", dir:"sent", day:2,
      time:D.slots[chosen], place:null,
      created:new Date().toISOString().slice(0,10), demo:true});
    persist(); closeSheet(); render(); toast(t("mtgSent"));
  };
}
function qrSheet(){
  var p = me(); if(!p) return;
  /* A deterministic block pattern seeded from the delegate record. It is not a
     scannable QR and does not claim to be: a real build encodes the delegate id
     with a proper encoder, which is a library rather than forty lines of demo. */
  var seed = 0, s = p.name + "|" + p.email + "|" + E.code;
  for(var i=0;i<s.length;i++) seed = (seed*31 + s.charCodeAt(i)) >>> 0;
  var cells = "";
  for(var y=0;y<29;y++) for(var x=0;x<29;x++){
    var fixed = (x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21);
    var edge = fixed && ((x%6===0)||(y%6===0)||(x>1&&x<5&&y>1&&y<5)||
                         (x>23&&x<27&&y>1&&y<5)||(x>1&&x<5&&y>23&&y<27));
    seed = (seed*1103515245 + 12345) >>> 0;
    cells += '<i style="background:'+((fixed?edge:((seed>>>16)&1))?"#0E273D":"#fff")+'"></i>';
  }
  el("sheetin").innerHTML = '<div class="grab"></div><h3>'+t("qrTitle")+'</h3>'+
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px">'+t("qrHelp")+'</p>'+
    '<div class="qr">'+cells+'</div><div style="text-align:center;margin-top:14px">'+
    '<div style="font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--hanoi)">'+
    esc(E.code)+'</div><div style="font-size:18px;font-weight:800;letter-spacing:-.02em;'+
    'margin-top:3px">'+esc(p.name)+'</div>'+
    '<div style="font-size:12.5px;color:var(--muted)">'+esc(p.role||"")+
    (p.org?" · "+esc(p.org):"")+'</div></div>'+
    '<button class="btn ghost" id="vcme" style="margin-top:16px">'+ico(I.down)+
    t("vcard")+'</button>';
  el("sheet").classList.add("on");
  el("vcme").onclick = function(){
    vcardOf(p.name, p.role, p.org, p.email, p.phone, p.li); };
}
function vcard(pid){
  var p = personById(pid); if(!p) return;
  var o = orgOf(p), hs = p.h || {};
  vcardOf(p.n, tx(p.t), o?o.n:"", o?o.email:"", hs.wa||"", hs.li||hs.web||"");
}
function vcardOf(name,role,org,email,tel,url){
  var L = ["BEGIN:VCARD","VERSION:3.0","FN:"+name,"N:"+name+";;;"];
  if(role) L.push("TITLE:"+role);
  if(org) L.push("ORG:"+org);
  if(email) L.push("EMAIL:"+email);
  if(tel) L.push("TEL:"+tel);
  if(url) L.push("URL:"+url);
  L.push("NOTE:"+E.title+" · "+E.displayDates, "END:VCARD");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/vcard"}));
  a.download = String(name).replace(/\s+/g,"-").toLowerCase()+".vcf";
  a.click();
  toast(t("vcard"));
}
/* ---- lightbox ---- */
function openLb(i){ lbIdx = i; drawLb(); el("lb").classList.add("on"); }
function drawLb(){
  var g = D.photos[lbIdx]; if(!g) return;
  el("lb").innerHTML = '<button class="x" id="lbx" aria-label="Close">'+ico(I.x)+'</button>'+
    '<img src="'+esc(g.full||g.image)+'" alt="'+esc(g.alt||"")+'">'+
    '<div class="nav"><button id="lbp" aria-label="Previous">&lsaquo;</button>'+
    '<button id="lbn" aria-label="Next">&rsaquo;</button></div>'+
    '<div class="cap">'+(lbIdx+1)+' / '+D.photos.length+
    (g.alt?' · '+esc(g.alt):'')+'</div>';
  el("lbx").onclick = function(){ el("lb").classList.remove("on"); };
  el("lbp").onclick = function(){
    lbIdx = (lbIdx-1+D.photos.length)%D.photos.length; drawLb(); };
  el("lbn").onclick = function(){ lbIdx = (lbIdx+1)%D.photos.length; drawLb(); };
}

render();
setInterval(function(){ if(view==="home" && !stack.length) render(); }, 1000);
})();
