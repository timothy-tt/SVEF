<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVEF Ha Noi 2026 — Event Back Office</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* SVEF Ha Noi 2026 back office. One event, one file.
   Deliberately NOT the multi-event back office: no event switcher, no event list,
   no "which event" column anywhere. Every screen is scoped to HANOI2026 and says
   so. English only, per the 14/08/2026 scope decision.
   Palette and type follow ../BRAND.md. */
:root{
  --red:#E42026; --red-d:#B31018; --red-t:#FDECEC; --red-ink:#B31018;
  --green:#3E7742; --green-d:#2C5730; --green-t:#EDF3EE;
  --gold:#C3933A; --gold-ink:#754715; --gold-t:#FBF3E4;
  --sky:#E2F4FD; --steel:#A8CED7;
  --ink:#0E273D; --ink-2:#224861; --muted:#3C6980; --line:#DAEDF0;
  --hanoi:#04723D; --wash:#F6FBF2; --wash-2:#EDF6EA; --deep:#123A2A;
  --bg:var(--wash); --card:#fff; --soft:var(--wash-2);
  --shadow:0 18px 44px rgba(14,39,61,.16);
  --sans:"Inter Tight","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --rail:240px;
}
*{box-sizing:border-box}
/* Inline icons are emitted by ico() all over the app, including places with no
   component rule of their own. Without a base size an SVG scales to fill its box
   and, with no stroke set, paints as a solid black shape. Later rules override. */
svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;
  line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--hanoi)}
/* ---- sign in ---- */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,var(--deep),var(--ink))}
.signin .box{background:var(--card);width:390px;max-width:100%;padding:28px;
  box-shadow:var(--shadow)}
.signin h1{margin:0 0 3px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.signin .ev{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--hanoi);margin-bottom:16px}
.signin p{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
/* ---- shell ---- */
.app{display:none;min-height:100vh;grid-template-columns:var(--rail) 1fr}
.app.on{display:grid}
.rail{background:linear-gradient(180deg,var(--deep),var(--ink));color:#fff;padding:18px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail .brand{padding:0 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:10px}
.rail .brand img{display:block;width:100%;height:auto;margin-bottom:8px}
.rail .brand span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold)}
.rail .brand em{display:block;font-style:normal;font-size:11px;opacity:.62;margin-top:6px}
.rail nav{flex:1;padding:0 10px}
.rail .grp{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  opacity:.45;padding:12px 10px 5px}
.rail button{width:100%;border:0;background:none;color:rgba(255,255,255,.76);font:inherit;
  font-size:13.5px;font-weight:600;text-align:left;padding:8px 10px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.rail button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}
.rail button:hover{color:#fff;background:rgba(255,255,255,.07)}
.rail button[aria-current=true]{background:#fff;color:var(--deep);font-weight:700}
.rail button .n{margin-left:auto;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.16);padding:1px 6px}
.rail button[aria-current=true] .n{background:var(--soft);color:var(--ink-2)}
.rail button .n.alert{background:var(--red);color:#fff}
.rail .foot{padding:12px 18px 0;border-top:1px solid rgba(255,255,255,.12);font-size:11px;
  opacity:.6;line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
.head{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:9}
.head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.head .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{padding:22px 26px 60px;max-width:1220px}
/* ---- bits ---- */
.btn{border:0;background:var(--hanoi);color:#fff;font:inherit;font-weight:700;font-size:13px;
  padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--deep)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{background:var(--soft)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-d)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px}
.card{background:var(--card);border:1px solid var(--line);padding:18px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:1040px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);padding:16px 18px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:6px}
.kpi.warn b{color:var(--gold-ink)} .kpi.good b{color:var(--hanoi)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;background:var(--soft);
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.green{background:var(--green-t);border-color:#CFE0D2;color:var(--green-d)}
.chip.gold{background:var(--gold-t);border-color:#EBD9B4;color:var(--gold-ink)}
.chip.red{background:var(--red-t);border-color:#F3CFD1;color:var(--red-ink)}
.chip.navy{background:var(--ink);border-color:var(--ink);color:#fff}
.warn{background:var(--gold-t);border:1px solid #EBD9B4;padding:12px 14px;font-size:12.5px;
  line-height:1.55;color:var(--gold-ink)}
.warn b{display:block;margin-bottom:3px}
.warn + .warn{margin-top:10px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--card);
  font:inherit;font-size:13.5px;padding:9px 11px;color:var(--ink)}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--hanoi);
  outline-offset:-2px}
.fld .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.row{display:flex;gap:12px}.row > *{flex:1;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--hanoi);border-bottom-color:var(--hanoi);
  font-weight:700}
.sesrow{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:start;
  padding:13px 0;border-bottom:1px solid var(--line)}
.sesrow:last-child{border-bottom:0}
.sesrow .t{font-size:13px;font-weight:700;color:var(--hanoi)}
.sesrow .t small{display:block;font-weight:500;color:var(--muted)}
.sesrow h4{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.sesrow ul{margin:5px 0 0;padding-left:17px;font-size:12.5px;color:var(--muted)}
.trkline{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.trkline span{font-size:11px;background:var(--soft);border:1px solid var(--line);padding:3px 7px}
.av{width:34px;height:34px;display:grid;place-items:center;color:#fff;font-weight:800;
  font-size:12px;flex:0 0 34px;background-size:cover;background-position:center}
.pv{display:flex;gap:11px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{border:1px solid var(--line);background:var(--card);padding:0;position:relative}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thumb .bar{display:flex;align-items:center;gap:6px;padding:7px 8px;font-size:11.5px}
.thumb .bar label{display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:600}
.thumb input{accent-color:var(--hanoi);width:14px;height:14px}
.thumb .no{opacity:.4}
.prs{display:flex;gap:11px;align-items:center}
.prs img{width:72px;height:48px;object-fit:cover;background:var(--soft);flex:0 0 72px}
.drawer{position:fixed;inset:0;background:rgba(11,31,22,.45);display:none;z-index:60;
  justify-content:flex-end}
.drawer.on{display:flex}
.drawer .in{background:var(--card);width:540px;max-width:100%;height:100%;overflow-y:auto;
  padding:22px 24px 40px;box-shadow:var(--shadow)}
.drawer h3{margin:0 0 2px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.drawer .sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.bar2{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.mono{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;font-weight:600;padding:11px 18px;z-index:80;opacity:0;
  pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.readonly{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.src{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--muted);line-height:1.6}
.sw{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .lb{flex:1;font-size:13px}
.sw .lb small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.sw input{width:17px;height:17px;accent-color:var(--hanoi)}
.pv .demo{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold-ink);background:var(--gold-t);border:1px solid #EBD9B4;padding:1px 5px}
</style>
</head>
<body>

<div class="signin" id="signin">
  <form class="box" id="loginform">
    <div class="ev" id="lgev">SVEF Ha Noi 2026</div>
    <h1>Event Back Office</h1>
    <p>Single-event console. This build manages the Ha Noi 2026 edition only.
       Any credentials are accepted in the demo.</p>
    <div class="fld"><label for="u">Work email</label>
      <input id="u" type="email" value="events@svef.ch" autocomplete="username"></div>
    <div class="fld"><label for="p">Password</label>
      <input id="p" type="password" value="demo" autocomplete="current-password"></div>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <img src="../assets/brand/svef-wordmark-dark.svg" alt="SVEF">
      <span id="brandcode">Ha Noi 2026</span>
      <em id="branddates"></em>
    </div>
    <nav id="nav"></nav>
    <div class="foot" id="railfoot"></div>
  </aside>
  <div class="main">
    <header class="head">
      <div><h2 id="vt"></h2><p id="vs"></p></div>
      <div class="sp" id="vactions"></div>
    </header>
    <div class="wrap" id="wrap"></div>
  </div>
</div>

<div class="drawer" id="drawer"><div class="in" id="drawerin"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
var D = window.HANOI2026, E = D.event;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function el(id){ return document.getElementById(id); }
function ico(p){ return '<svg viewBox="0 0 24 24">'+p+'</svg>'; }
function tx(o){ if(!o) return ""; if(typeof o==="string") return o; return o.en || ""; }
var I={
 dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
 cal:'<rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3.2-6.5 7-6.5S16 17 16 21"/><path d="M17 11a3.5 3.5 0 1 0-1.5-6.6"/><path d="M18 21c0-2.6-.8-4.5-2-5.7"/>',
 bldg:'<rect x="4" y="3" width="16" height="18"/><path d="M8 7h3M13 7h3M8 11h3M13 11h3M8 15h3M13 15h3"/>',
 form:'<rect x="4" y="3" width="16" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
 img:'<rect x="3" y="5" width="18" height="14"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
 bell:'<path d="M18 16V11a6 6 0 1 0-12 0v5l-2 3h16z"/><path d="M10 21h4"/>',
 gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>',
 alert:'<path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17v.01"/>',
 net:'<circle cx="6" cy="7" r="3"/><circle cx="18" cy="7" r="3"/><circle cx="12" cy="18" r="3"/><path d="M8.6 8.7l2.6 6.8M15.4 8.7l-2.6 6.8M9 7h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M4 20h4l10-10-4-4L4 16v4z"/>',
 down:'<path d="M12 4v12M7 12l5 5 5-5"/><path d="M4 20h16"/>',
 check:'<path d="M4 12.5l5 5L20 6.5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 eye:'<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>',
 ext:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5H5V5h5"/>',
 send:'<path d="M4 12l16-8-6 16-2.5-6.5z"/>'
};

/* ---------------------------------------------------------------------------
   Local working copy. The console edits a copy in localStorage so changes survive
   a reload without pretending there is a backend. "Revert to scraped source"
   throws it away and goes back to exactly what scrape.py pulled off the site.
   --------------------------------------------------------------------------- */
var KEY = "svef.hanoi.admin";
var S = JSON.parse(localStorage.getItem(KEY) || "null") || seed();
function seed(){
  return {
    days: JSON.parse(JSON.stringify(D.days)),
    speakers: JSON.parse(JSON.stringify(D.speakers)),
    attendees: JSON.parse(JSON.stringify(D.attendees)),
    orgs: JSON.parse(JSON.stringify(D.orgs)),
    fields: JSON.parse(JSON.stringify(D.registration.fields)),
    docs: JSON.parse(JSON.stringify(D.docs)),
    press: JSON.parse(JSON.stringify(D.press)).map(function(p,i){
      return Object.assign({id:"pr"+(i+1), pub:true}, p); }),
    photos: JSON.parse(JSON.stringify(D.photos)).map(function(g,i){
      return Object.assign({id:"ph"+(i+1), pub:i<9}, g); }),
    notifs: JSON.parse(JSON.stringify(D.notifications)).map(function(n){
      return Object.assign({sent:true}, n); }),
    claims: seedClaims(),
    settings: {
      displayDates: E.displayDates, start: E.start, end: E.end,
      venue: E.venue || "", city: E.city, contact: E.contactEmail,
      status: E.status, regStatus: D.registration.status, closes: D.registration.closes,
      /* 2.4 in the BRD is explicitly unresolved: whether only members may connect.
         Rather than guess, it is a switch the secretariat sets, defaulting to what
         the registration form already asks. */
      connectPolicy: "opt-in"
    },

    conns: JSON.parse(JSON.stringify(D.connections || [])),
    meetings: JSON.parse(JSON.stringify(D.meetings || []))
  };
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function seedClaims(){
  /* Nothing self-approves. An attendee who could link themselves could attach their
     name to any sponsor on the list, which is exactly what the secretariat is for. */
  return [
    {id:"c1", who:"Beatrice Fontana", email:"b.fontana@alpinecapital.example.ch",
     typed:"Alpine Capital", oid:"alpinecap", state:"pending", at:"2026-09-04"},
    {id:"c2", who:"Đỗ Quang Huy", email:"huy.do@northwind.example.vn",
     typed:"Northwind Energy", oid:"northwind", state:"pending", at:"2026-09-05"},
    {id:"c3", who:"Stefan Brun", email:"s.brun@helvetiamedtech.example.ch",
     typed:"Helvetia Med", oid:"helvetiamed", state:"linked", at:"2026-09-01"}
  ];
}

/* ---------- helpers ---------- */
function orgById(id){ return S.orgs.filter(function(o){ return o.id===id; })[0] || null; }
function repsOf(id){ return S.attendees.filter(function(p){ return p.oid===id; }); }
function counts(){
  return {
    sessions: S.days.reduce(function(a,d){ return a+d.sessions.length; },0),
    tracks: S.days.reduce(function(a,d){
      return a+d.sessions.reduce(function(b,s){ return b+(s.tracks?s.tracks.length:0); },0); },0),
    speakers: S.attendees.filter(function(p){ return p.speaker; }).length,
    delegates: S.attendees.filter(function(p){ return !p.speaker; }).length,
    inDir: S.attendees.filter(function(p){ return p.dir; }).length,
    orgs: S.orgs.length,
    rsvps: S.attendees.filter(function(p){ return !p.speaker; }).length,
    confirmed: S.attendees.filter(function(p){ return p.status==="confirmed"; }).length,
    conns: (S.conns||[]).length,
    connPending: (S.conns||[]).filter(function(c){ return c.state==="pending"; }).length,
    claims: S.claims.filter(function(c){ return c.state==="pending"; }).length,
    press: S.press.length, pressPub: S.press.filter(function(p){ return p.pub; }).length,
    photos: S.photos.length, photosPub: S.photos.filter(function(p){ return p.pub; }).length,
    docs: S.docs.length,
    notifs: S.notifs.length,
    issues: issues().length
  };
}
function fdt(iso){ if(!iso) return "–";
  return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function kv(k,v){ return '<div style="display:flex;gap:12px;padding:7px 0;'+
  'border-bottom:1px solid var(--line)"><span style="flex:0 0 122px;font-size:12px;'+
  'color:var(--muted);font-weight:600">'+esc(k)+'</span>'+
  '<span style="flex:1;font-size:13.5px;min-width:0">'+v+'</span></div>'; }
function kpi(n,l,cls){ return '<div class="kpi '+(cls||"")+'"><b>'+n+'</b><span>'+
  esc(l)+'</span></div>'; }
function avatar(p){
  if(p.photo) return '<span class="av" style="background-image:url('+esc(p.photo)+')"></span>';
  return '<span class="av" style="background:'+esc(p.c||"#04723D")+'">'+esc(p.i||"?")+'</span>';
}

/* ---------- data-health checks against the live source ---------- */
function issues(){
  var out = [];
  out.push({t:"Three sources disagree on the event dates",
    b:"The Wix Events record says "+E.start.slice(0,10)+" to "+E.end.slice(0,10)+
      ", its own tagline says “"+E.tagline+"”, and the CMS Events row still says "+
      "2026-10-01 to 2026-10-03. This console and the attendee app use "+
      S.settings.displayDates+". The programme has three days, which only fits an "+
      "18 to 20 October window. Confirm with SVEF and fix it at source."});
  var tbd = S.days.filter(function(d){
    return !d.meta.venue || /updated|tbd/i.test(d.meta.venue); }).length;
  if(tbd) out.push({t:"Venue not published for "+tbd+" of "+S.days.length+" days",
    b:"Every day still reads “Venue: to be updated” on the event site. Delegates "+
      "cannot book accommodation or transport against a city name alone."});
  out.push({t:"Venue coordinates point at Zurich",
    b:"The Wix Events location is named “Ha Noi” but carries the Zurich address and "+
      "geocode 47.375, 8.549 left over from the Zurich edition. Any map pin drawn "+
      "from that record lands in Switzerland."});

  /* The RSVP form asks delegates to pick a parallel session by name. If those names
     drift from the published agenda, a delegate books a session that does not exist
     under that title, so the two lists are compared letter for letter. */
  var agendaTracks = [];
  S.days.forEach(function(d){ d.sessions.forEach(function(x){
    (x.tracks||[]).forEach(function(tr){
      agendaTracks.push("Session "+tr.track+": "+tr.title); }); }); });
  var formTracks = [];
  S.fields.forEach(function(f){
    if(/parallel session/i.test(f.label))
      (f.options||[]).forEach(function(o){ formTracks.push(o); });
  });
  var drift = formTracks.filter(function(o){ return agendaTracks.indexOf(o)===-1; });
  if(formTracks.length && drift.length)
    out.push({t:drift.length+" parallel sessions are named differently in the RSVP form",
      b:"Delegates choose a session by name at registration, but these options do not "+
        "match the published agenda: "+drift.join("; ")+". Align the two or the "+
        "headcount per session will not reconcile."});

  /* Option text from the live form is shown to delegates verbatim, in the app and
     on their profile, so a typo in an option is a typo on every delegate's screen. */
  var typos = [];
  S.fields.forEach(function(f){
    (f.options||[]).forEach(function(o){
      if(/\b(Insititutional|Recieve|Occured|Seperate|Adress|Buisness)\b/i.test(o) ||
         /\bInda\b/.test(o))
        typos.push('"'+o+'" ('+f.label.trim()+')');
    });
  });
  if(typos.length)
    out.push({t:typos.length+" misspelled option"+(typos.length>1?"s":"")+" on the live RSVP form",
      b:"Delegates pick these by name and the app shows the answer back on their profile, "+
        "so the misspelling ends up on every affected delegate's screen: "+typos.join("; ")+
        ". Fix it in the Wix form, not here."});

  ["accommodation","visa","transportation"].forEach(function(k){
    if(!(D.info[k==="accommodation" ? "accommodation" : k] || "").trim())
      out.push({t:"No "+k+" content published",
        b:"The /events-"+(k==="accommodation"?"accomodation":k)+"/hanoi2026 page "+
          "resolves but the field is empty in the CMS, so the app shows a placeholder."});
  });
  var spk = S.attendees.filter(function(p){ return p.speaker; }).length;
  if(spk < 10) out.push({t:"Only "+spk+" speakers linked to this event",
    b:"The Speakers collection holds "+D.meta.speakerPool+" records site wide, but only "+
      spk+" are linked to HANOI2026. The Zurich 2026 edition links 42."});
  var noDir = S.attendees.filter(function(p){ return !p.speaker && !p.dir; }).length;
  if(noDir) out.push({t:noDir+" delegates opted out of the directory",
    b:"They answered “No, please keep my details private” on the registration form, "+
      "so they appear in this console but are not contactable in the app. That is "+
      "the delegate's choice, not a data fault; it is listed so the headcount adds up."});
  return out;
}

/* =========================================================================
   Shell
   ========================================================================= */
function render(){
  var c = counts();
  var nums = {agenda:c.sessions, speakers:c.speakers, attendees:c.rsvps,
    orgs:c.claims ? c.claims : c.orgs, connections:c.conns,
    media:c.photos+c.press, docs:c.docs, notify:c.notifs, health:c.issues};
  el("nav").innerHTML = VIEWS.map(function(v){
    if(v.g) return '<div class="grp">'+esc(v.g)+'</div>';
    var n = nums[v.id];
    var alert = (v.id==="orgs" && c.claims) || (v.id==="health" && c.issues) ||
                (v.id==="connections" && c.connPending);
    return '<button data-go="'+v.id+'" aria-current="'+(view===v.id)+'">'+ico(v.icon)+
      '<span>'+esc(v.label)+'</span>'+
      (n!==undefined ? '<span class="n'+(alert?" alert":"")+'">'+n+'</span>' : '')+'</button>';
  }).join("");
  var v = VIEWS.filter(function(x){ return x.id===view; })[0] || VIEWS[1];
  el("vt").textContent = v.title;
  el("vs").textContent = v.sub;
  el("vactions").innerHTML =
    '<a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">'+ico(I.eye)+
    'Attendee app</a><a class="btn ghost sm" href="'+esc(E.eventUrl)+
    '" target="_blank" rel="noopener">'+ico(I.ext)+'Live site</a>';
  el("branddates").textContent = S.settings.displayDates+" · "+S.settings.city;
  el("railfoot").innerHTML = "Scoped to "+esc(E.code)+" only.<br>No event switcher by design.";
  var body = {dash:dashHTML, agenda:agendaHTML, speakers:speakersHTML,
    attendees:attendeesHTML, orgs:orgsHTML, connections:connectionsHTML,
    media:mediaHTML, docs:docsHTML, notify:notifyHTML,
    network:networkHTML, health:healthHTML, settings:settingsHTML}[view];
  el("wrap").innerHTML = body ? body() : "";
  window.scrollTo(0,0);
}
function toast(m){
  var x = el("toast"); x.textContent = m; x.classList.add("on");
  clearTimeout(x._t); x._t = setTimeout(function(){ x.classList.remove("on"); }, 1700);
}

el("loginform").addEventListener("submit", function(e){
  e.preventDefault();
  el("signin").style.display = "none";
  el("app").classList.add("on");
  render();
});

document.addEventListener("click", function(ev){
  var n;
  if((n = ev.target.closest("[data-go]"))){ view = n.getAttribute("data-go"); render(); return; }
  if((n = ev.target.closest("[data-aday]"))){ aday = +n.getAttribute("data-aday");
    render(); return; }
  if((n = ev.target.closest("[data-mtab]"))){ mediaTab = n.getAttribute("data-mtab");
    render(); return; }
  if((n = ev.target.closest("[data-editses]"))){ editSession(n.getAttribute("data-editses"));
    return; }
  if((n = ev.target.closest("[data-newses]"))){ editSession(null,+n.getAttribute("data-newses"));
    return; }
  if((n = ev.target.closest("[data-delses]"))){ delSession(n.getAttribute("data-delses"));
    return; }
  if((n = ev.target.closest("[data-editday]"))){ editDay(+n.getAttribute("data-editday"));
    return; }
  if((n = ev.target.closest("[data-editperson]"))){
    editPerson(+n.getAttribute("data-editperson")); return; }
  if(ev.target.closest("[data-newperson]")){ editPerson(null,false); return; }
  if(ev.target.closest("[data-newspk]")){ editPerson(null,true); return; }
  if((n = ev.target.closest("[data-editorg]"))){ editOrg(n.getAttribute("data-editorg"));
    return; }
  if(ev.target.closest("[data-neworg]")){ editOrg(null); return; }
  if((n = ev.target.closest("[data-editdoc]"))){ editDoc(n.getAttribute("data-editdoc"));
    return; }
  if(ev.target.closest("[data-newdoc]")){ editDoc(null); return; }
  if((n = ev.target.closest("[data-deldoc]"))){
    var did = n.getAttribute("data-deldoc");
    S.docs = S.docs.filter(function(d){ return d.id!==did; });
    persist(); render(); toast("Document removed"); return;
  }
  if((n = ev.target.closest("[data-delnotif]"))){
    var nid = n.getAttribute("data-delnotif");
    S.notifs = S.notifs.filter(function(x){ return x.id!==nid; });
    persist(); render(); toast("Notification removed"); return;
  }
  if((n = ev.target.closest("[data-claim]"))){
    var a = n.getAttribute("data-claim").split("|");
    S.claims.forEach(function(c){
      if(c.id===a[1]) c.state = a[0]==="approve" ? "linked" : "rejected"; });
    persist(); render();
    toast(a[0]==="approve" ? "Claim approved" : "Claim rejected"); return;
  }
  if(ev.target.id==="pubAll"){
    S.photos.forEach(function(p){ p.pub = true; });
    persist(); render(); toast("All photos published"); return;
  }
  if(ev.target.id==="n_send"){ sendNotif(); return; }
  if(ev.target.id==="csvatt"){ exportCsv("attendees"); return; }
  if(ev.target.id==="csvconn"){ exportCsv("connections"); return; }
  if((n = ev.target.closest("[data-block]"))){
    var ab = n.getAttribute("data-block").split("|");
    S.conns.forEach(function(c){
      if(c.a===+ab[0] && c.b===+ab[1]) c.state = "blocked"; });
    persist(); render(); toast("Connection blocked"); return;
  }
  if(ev.target.id==="revert"){
    localStorage.removeItem(KEY); S = seed(); render();
    toast("Reverted to the scraped source"); return;
  }
  if(ev.target.closest(".drawer") && !ev.target.closest(".drawer .in")) closeDrawer();
});

document.addEventListener("change", function(ev){
  var tg = ev.target, k;
  if((k = tg.getAttribute && tg.getAttribute("data-set"))){
    S.settings[k] = tg.value; persist(); render(); toast("Saved"); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-req"))){
    S.fields.forEach(function(f){ if(f.id===k) f.required = tg.checked; });
    persist(); render(); toast("Field updated"); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-rst"))){
    S.attendees.forEach(function(p){ if(p.id===+k) p.status = tg.value; });
    persist(); render(); toast("Status updated"); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-dir"))){
    S.attendees.forEach(function(p){ if(p.id===+k) p.dir = tg.checked; });
    persist(); render(); toast("Directory listing updated"); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-pub"))){
    S.photos.forEach(function(p){ if(p.id===k) p.pub = tg.checked; });
    persist(); render(); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-pubp"))){
    S.press.forEach(function(p){ if(p.id===k) p.pub = tg.checked; });
    persist(); render(); return; }
  if((k = tg.getAttribute && tg.getAttribute("data-cp"))){
    S.settings.connectPolicy = k; persist(); render(); toast("Networking rule saved"); return; }
});

/* ---------- drawers ---------- */
function openDrawer(html){ el("drawerin").innerHTML = html; el("drawer").classList.add("on"); }
function closeDrawer(){ el("drawer").classList.remove("on"); }

function findSes(id){
  for(var i=0;i<S.days.length;i++){
    var d = S.days[i];
    for(var j=0;j<d.sessions.length;j++)
      if(d.sessions[j].id===id) return {d:d, s:d.sessions[j], j:j};
  }
  return null;
}
function editSession(id, dayNo){
  var f = id ? findSes(id) : null;
  var s = f ? f.s : {id:"", start:"", end:"", title:"", kind:"session", detail:[], tracks:[]};
  var day = f ? f.d.day : dayNo;
  var h = '<h3>'+(id?"Edit session":"New session")+'</h3><div class="sub">Day '+day+' · '+
    esc((S.days.filter(function(x){ return x.day===day; })[0]||{}).title||"")+'</div>';
  h += '<div class="row"><div class="fld"><label>Start</label><input id="e_start" value="'+
    esc(s.start||"")+'" placeholder="09:00"></div><div class="fld"><label>End</label>'+
    '<input id="e_end" value="'+esc(s.end||"")+'" placeholder="10:00"></div>'+
    '<div class="fld"><label>Kind</label><select id="e_kind">'+
    ["session","business","culture","transfer"].map(function(o){
      return '<option'+(o===(s.kind||"session")?" selected":"")+'>'+o+'</option>'; }).join("")+
    '</select></div></div>';
  h += '<div class="fld"><label>Title</label><input id="e_title" value="'+esc(s.title)+
    '"></div>';
  h += '<div class="fld"><label>Detail (one line each)</label><textarea id="e_detail">'+
    esc((s.detail||[]).join("\n"))+'</textarea></div>';
  h += '<div class="fld"><label>Parallel tracks (one per line: '+
    '<span class="mono">A | Title | Summary</span>)</label><textarea id="e_tracks">'+
    esc((s.tracks||[]).map(function(t){
      return [t.track,t.title,t.summary].join(" | "); }).join("\n"))+'</textarea>'+
    '<div class="hint">Leave empty for a plenary session. Delegates pick one track in '+
    'the app, and the choice is also asked on the RSVP form.</div></div>';
  h += '<div class="bar2"><button class="btn" id="e_save">Save session</button>'+
    '<button class="btn ghost" id="e_cancel">Cancel</button></div>';
  openDrawer(h);
  el("e_cancel").onclick = closeDrawer;
  el("e_save").onclick = function(){
    var d = S.days.filter(function(x){ return x.day===day; })[0];
    var rec = {
      id: s.id || ("d"+day+"s"+(Date.now()%100000)),
      start: el("e_start").value.trim(), end: el("e_end").value.trim() || null,
      title: el("e_title").value.trim(), kind: el("e_kind").value,
      detail: el("e_detail").value.split("\n").map(function(x){ return x.trim(); })
                .filter(Boolean),
      tracks: el("e_tracks").value.split("\n").map(function(l){ return l.trim(); })
        .filter(Boolean).map(function(l){
          var p = l.split("|").map(function(x){ return x.trim(); });
          return {track:p[0]||"", title:p[1]||"", summary:p[2]||""}; })
    };
    if(!rec.title){ toast("A title is required"); return; }
    if(f) d.sessions[f.j] = rec; else d.sessions.push(rec);
    d.sessions.sort(function(a,b){ return (a.start||"99")<(b.start||"99") ? -1 : 1; });
    persist(); closeDrawer(); aday = day; render();
    toast(id?"Session updated":"Session added");
  };
}
function delSession(id){
  var f = findSes(id); if(!f) return;
  f.d.sessions.splice(f.j,1); persist(); render(); toast("Session removed");
}

function editPerson(id, isSpeaker){

                 t:{en:""}, bio:{en:""}, h:{}};

    '<option value="">—</option>'+S.orgs.map(function(o){
      return '<option value="'+esc(o.id)+'"'+(o.id===p.oid?" selected":"")+'>'+esc(o.n)+
        '</option>'; }).join("")+'</select></div>';
  h += '<div class="fld"><label>Focus</label><select id="k_ind">'+
    Object.keys(D.taxonomy.industries).map(function(k){
      return '<option value="'+k+'"'+(k===p.ind?" selected":"")+'>'+
        esc(tx(D.taxonomy.industries[k]))+'</option>'; }).join("")+'</select></div></div>';
  h += '<div class="row"><div class="fld"><label>Tier</label><select id="k_tier">'+
    Object.keys(D.taxonomy.tiers).map(function(k){
      return '<option value="'+k+'"'+(k===p.tier?" selected":"")+'>'+
        esc(tx(D.taxonomy.tiers[k]))+'</option>'; }).join("")+'</select></div>';
  h += '<div class="fld"><label>Session picks (letters, comma separated)</label>'+
    '<input id="k_picks" value="'+esc((p.picks||[]).join(", "))+'" placeholder="A, E"></div>'+
    '</div>';
  h += '<div class="fld"><label>Biography</label><textarea id="k_bio" '+
    'style="min-height:140px">'+esc(tx(p.bio))+'</textarea></div>';
  h += '<label class="sw"><span class="lb"><b>Listed in the delegate directory</b>'+
    '<small>Comes from the delegate\'s own answer on the registration form.</small></span>'+
    '<input type="checkbox" id="k_dir"'+(p.dir?" checked":"")+'></label>';
  h += '<label class="sw"><span class="lb"><b>Joining the Day 3 field visit</b></span>'+
    '<input type="checkbox" id="k_day3"'+(p.day3?" checked":"")+'></label>';
  h += '<div class="bar2"><button class="btn" id="k_save">Save</button>'+
    '<button class="btn ghost" id="k_cancel">Cancel</button>'+
    (isNew?"":'<button class="btn ghost" id="k_del" style="margin-left:auto">Unlink</button>')+
    '</div>';
  openDrawer(h);
  el("k_cancel").onclick = closeDrawer;
  if(el("k_del")) el("k_del").onclick = function(){
    S.attendees = S.attendees.filter(function(x){ return x.id!==id; });
    persist(); closeDrawer(); render(); toast("Removed from this event");
  };
  el("k_save").onclick = function(){
    var name = el("k_n").value.trim();
    if(!name){ toast("A name is required"); return; }

    var rec = {

      mkts: p.mkts || [], dir: el("k_dir").checked, day3: el("k_day3").checked,
      speaker: p.speaker, demo: p.demo === undefined ? true : p.demo,

               .filter(Boolean),
      t: {en: el("k_t").value.trim(), vi: el("k_t").value.trim()},
      bio: {en: el("k_bio").value.trim(), vi: el("k_bio").value.trim()},
      h: p.h || {}
    };
    if(isNew) S.attendees.push(rec);
    else S.attendees = S.attendees.map(function(x){ return x.id===id ? rec : x; });

function sendNotif(){
  var title = el("n_title").value.trim(), body = el("n_body").value.trim();
  if(!title){ toast("A title is required"); return; }
  S.notifs.unshift({id:"n"+(Date.now()%100000), kind:el("n_kind").value,
    go:el("n_go").value, when:"now", unread:true, sent:true,
    t:{en:title, vi:title}, b:{en:body, vi:body}});
  persist(); render(); toast("Notification sent to all delegates");
}
function exportCsv(which){
  var head, rows, name;
  if(which==="connections"){
    head = ["From","From organisation","To","To organisation","Message","Sent","State"];
    rows = S.conns.map(function(c){
      var a = attById(c.a), b = attById(c.b);
      return [a?a.n:c.a, a?((orgById(a.oid)||{}).n||"") : "",
              b?b.n:c.b, b?((orgById(b.oid)||{}).n||"") : "",
              c.msg||"", c.at||"", c.state];
    });
    name = "connections";
  } else {
    head = ["Name","Email","Role","Organisation","Country","Focus","Tier","Picks",
            "Day 3","In directory","Status","Received"];
    rows = S.attendees.filter(function(p){ return !p.speaker; }).map(function(p){
      var o = orgById(p.oid);
      return [p.n, p.email||"", tx(p.t), o?o.n:"", p.country||"",
              tx(D.taxonomy.industries[p.ind]), tx(D.taxonomy.tiers[p.tier]),
              (p.picks||[]).join(" "), p.day3?"yes":"no", p.dir?"yes":"no",
              p.status||"", p.received||""];
    });
    name = "attendees";
  }
  var csv = [head].concat(rows).map(function(r){
    return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; })
      .join(","); }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = E.code.toLowerCase()+"-"+name+".csv";
  a.click();
  toast("Exported "+rows.length+" rows");
}

el("lgev").textContent = E.title;
})();
